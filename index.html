<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f5f0e8;
  --black:#1a1a18;
  --red:#c41e1e;
  --gray:#888880;
  --lt-gray:#e8e4dc;
  --text:#2a2a26;
  --serif:'EB Garamond',Georgia,serif;
  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
body{background:var(--cream);color:var(--text);font-family:var(--sans);font-weight:300;min-height:100vh;padding-bottom:80px}

header{background:var(--black);padding:0;border-bottom:3px solid var(--red)}
.header-inner{display:flex;align-items:stretch;max-width:1100px;margin:0 auto}
.header-logo{padding:14px 20px;border-right:1px solid #333;display:flex;align-items:center;gap:10px}
.logo-mark{width:36px;height:36px;border:2px solid var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:18px;height:18px}
.header-title{font-family:var(--serif);font-size:1.5rem;font-weight:400;color:#fff;letter-spacing:0.04em}
.header-subtitle{font-family:var(--sans);font-size:0.55rem;font-weight:400;color:#888;letter-spacing:0.2em;text-transform:uppercase;margin-top:1px}
.header-right{flex:1;display:flex;align-items:center;justify-content:flex-end;padding:0 20px;gap:16px}
.total-pill{font-size:0.65rem;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;color:#888;font-family:var(--sans)}
.total-pill strong{color:var(--red)}

nav{background:var(--black);border-bottom:1px solid #222;position:sticky;top:0;z-index:100;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nav-inner{display:flex;max-width:1100px;margin:0 auto}
.tab{padding:12px 18px;font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;font-weight:400;color:#666;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color 0.15s;font-family:var(--sans)}
.tab:hover{color:#aaa}
.tab.active{color:#fff;border-bottom-color:var(--red)}
.tab-count{margin-left:4px;color:#444;font-size:0.55rem}
.tab.active .tab-count{color:#c41e1e80}

main{max-width:1100px;margin:0 auto;padding:0 16px}

.section{display:none}
.section.active{display:block}

.section-head{padding:32px 0 20px;border-bottom:1px solid var(--black);margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end}
.section-head h2{font-family:var(--serif);font-size:2rem;font-weight:400;color:var(--black);letter-spacing:0.01em;font-style:italic}
.section-meta{font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gray);font-family:var(--sans)}
.section-meta strong{color:var(--red)}

.genre-group{margin-bottom:36px}
.genre-label{font-size:0.58rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gray);font-family:var(--sans);font-weight:400;padding:0 0 10px;border-bottom:0.5px solid var(--lt-gray);margin-bottom:0}

.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0;border-left:0.5px solid var(--lt-gray)}

.media-card{border-right:0.5px solid var(--lt-gray);border-bottom:0.5px solid var(--lt-gray);padding:0;position:relative;transition:background 0.15s;cursor:default}
.media-card:hover{background:#eee9df}
.media-card.done{background:#f0ede6}
.media-card.done:hover{background:#ebe7de}

.card-thumb{width:100%;aspect-ratio:2/3;background:var(--lt-gray);overflow:hidden;position:relative;border-bottom:0.5px solid var(--lt-gray)}
.card-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 0.3s}
.card-thumb img.loaded{opacity:1}
.thumb-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:2.5rem;color:#333;background:var(--black);font-style:italic}
.done-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s}
.media-card.done .done-overlay{opacity:1}
.done-check{width:40px;height:40px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem}

.card-body{padding:12px 12px 10px}
.card-number{font-size:0.5rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gray);font-family:var(--sans);margin-bottom:4px}
.card-title{font-family:var(--serif);font-size:0.95rem;font-weight:400;line-height:1.3;color:var(--black);margin-bottom:6px}
.media-card.done .card-title{color:var(--gray);text-decoration:line-through;text-decoration-color:var(--red)}
.card-meta{font-size:0.6rem;color:var(--gray);font-family:var(--sans);font-weight:300;line-height:1.6;margin-bottom:8px}
.card-meta span{display:block}

.card-links{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;padding:2px 7px;font-size:0.5rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:400;text-decoration:none;font-family:var(--sans);transition:opacity 0.15s;border:0.5px solid}
.badge:hover{opacity:0.7}
.badge-imdb{background:var(--black);color:#f5c518;border-color:var(--black)}
.badge-wiki{background:transparent;color:var(--text);border-color:var(--gray)}

.card-actions{display:flex;align-items:center;gap:6px;padding:0 12px 12px;justify-content:space-between}
.check-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--gray);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:transparent;transition:all 0.15s;flex-shrink:0}
.check-btn.checked{background:var(--red);border-color:var(--red);color:#fff}
.stars-row{display:flex;gap:2px}
.star{font-size:0.75rem;cursor:pointer;color:var(--lt-gray);transition:color 0.1s;line-height:1}
.star.lit{color:var(--red)}
.del-btn{background:none;border:none;color:var(--lt-gray);font-size:0.8rem;cursor:pointer;padding:0;line-height:1}
.del-btn:hover{color:var(--red)}

.review-area{padding:0 12px 12px;border-top:0.5px solid var(--lt-gray);display:none}
.media-card.done .review-area{display:block;padding-top:10px}
.review-input{width:100%;background:transparent;border:none;border-bottom:0.5px solid var(--lt-gray);color:var(--text);font-size:0.75rem;font-family:var(--serif);font-style:italic;padding:4px 0;margin-bottom:6px;resize:none;min-height:28px}
.review-input:focus{outline:none;border-bottom-color:var(--red)}
.review-display{font-size:0.75rem;font-family:var(--serif);font-style:italic;color:var(--gray);line-height:1.5}
.save-btn{font-size:0.5rem;letter-spacing:0.15em;text-transform:uppercase;font-family:var(--sans);background:none;border:0.5px solid var(--gray);color:var(--gray);padding:3px 8px;cursor:pointer;transition:all 0.15s}
.save-btn:hover{background:var(--black);color:#fff;border-color:var(--black)}

.add-panel{background:var(--black);padding:24px;margin:28px 0;border-left:3px solid var(--red)}
.add-panel h3{font-family:var(--serif);font-size:0.8rem;font-weight:400;color:#888;letter-spacing:0.1em;font-style:italic;margin-bottom:14px}
.add-fields{display:flex;gap:8px;flex-wrap:wrap}
.add-fields input,.add-fields select{background:transparent;border:none;border-bottom:1px solid #444;color:#ccc;font-size:0.8rem;font-family:var(--sans);font-weight:300;padding:6px 0;flex:1;min-width:120px}
.add-fields input::placeholder{color:#555}
.add-fields input:focus,.add-fields select:focus{outline:none;border-bottom-color:var(--red)}
.add-fields select option{background:var(--black)}
.add-submit{background:var(--red);color:#fff;border:none;padding:8px 18px;font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;font-family:var(--sans);cursor:pointer;transition:background 0.15s;align-self:flex-end}
.add-submit:hover{background:#a01818}

@media(max-width:600px){
  .items-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .header-title{font-size:1.2rem}
  .tab{padding:10px 12px;font-size:0.55rem}
}
</style>
</head>

const CATEGORIES = ["TV","Movies","Books","Podcasts","YouTube","Other","Games"];
const ICONS = {TV:"▶",Movies:"◉",Books:"◈",Podcasts:"◎",YouTube:"▷",Other:"◇",Games:"◆"};

function loadState(){try{return JSON.parse(localStorage.getItem('theList_criterion_v1'))||{};}catch{return {};}}
function saveState(s){localStorage.setItem('theList_criterion_v1',JSON.stringify(s));}
function loadUserItems(){try{return JSON.parse(localStorage.getItem('theListUser_criterion_v1'))||[];}catch{return [];}}
function saveUserItems(u){localStorage.setItem('theListUser_criterion_v1',JSON.stringify(u));}

let state=loadState(), userItems=loadUserItems(), activeTab=CATEGORIES[0];

function allItems(cat){
  const genreMap=GENRES[cat]||{};
  const byGenre={};
  for(const [g,titles] of Object.entries(genreMap)){
    byGenre[g]=titles.map(t=>({title:t,type:cat,source:'baseline'}));
  }
  const extra=[];
  userItems.filter(m=>m.type===cat).forEach(m=>{
    const src={...m,source:'user'};
    if(m.genre&&byGenre[m.genre]){byGenre[m.genre].push(src);}
    else{extra.push(src);}
  });
  if(extra.length){byGenre['Uncategorized']=extra;}
  return byGenre;
}

function allFlat(cat){return Object.values(allItems(cat)).flat();}
function getKey(item){return (item.source==='user'?'u:':'b:')+item.type+':'+item.title;}

function imgSrc(item){const m=META[item.title];return m&&m.thumb?m.thumb:null;}
function wikiLink(item){
  const m=META[item.title];
  const slug=m&&m.wiki?m.wiki:encodeURIComponent(item.title.replace(/ /g,'_'));
  return 'https://en.wikipedia.org/wiki/'+slug;
}
function imdbLink(item){
  const m=META[item.title];
  if(m&&m.imdb)return 'https://www.imdb.com/title/'+m.imdb+'/';
  return 'https://www.imdb.com/find?q='+encodeURIComponent(item.title);
}
function itemMeta(item){const m=META[item.title];return m?m.meta:'';}

let cardCounter=0;
function renderCard(item,idx){
  const key=getKey(item);
  const s=state[key]||{};
  const done=!!s.done;
  const rating=s.rating||0;
  const review=s.review||'';
  const safeKey=key.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
  const id='card-'+(cardCounter++);
  const thumb=imgSrc(item);
  const hasImdb=(item.type==='TV'||item.type==='Movies'||item.type==='Games');
  const meta=itemMeta(item);
  const numStr=String(idx+1).padStart(3,'0');

  return `<div class="media-card ${done?'done':''}" id="${id}">
    <div class="card-thumb">
      ${thumb
        ?`<div class="thumb-placeholder">${item.title.charAt(0)}</div><img src="${thumb}" alt="${item.title}" loading="lazy" onload="this.classList.add('loaded')" onerror="this.style.display='none'">`
        :`<div class="thumb-placeholder">${item.title.charAt(0)}</div>`}
      <div class="done-overlay"><div class="done-check">&#10003;</div></div>
    </div>
    <div class="card-body">
      <div class="card-number">${numStr}</div>
      <div class="card-title">${item.title}</div>
      ${meta?`<div class="card-meta"><span>${meta}</span></div>`:''}
      <div class="card-links">
        ${hasImdb?`<a class="badge badge-imdb" href="${imdbLink(item)}" target="_blank" rel="noopener">IMDb</a>`:''}
        <a class="badge badge-wiki" href="${wikiLink(item)}" target="_blank" rel="noopener">Wikipedia</a>
      </div>
    </div>
    <div class="card-actions">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="check-btn ${done?'checked':''}" onclick="toggleDone('${safeKey}')">${done?'&#10003;':''}</button>
        ${done?`<div class="stars-row">${[1,2,3,4,5].map(n=>`<span class="star ${rating>=n?'lit':''}" onclick="setRating('${safeKey}',${n})">&#9733;</span>`).join('')}</div>`:''}`+
      `</div>
      ${item.source==='user'?`<button class="del-btn" onclick="delItem('${safeKey}')">&#10005;</button>`:''}
    </div>
    ${done?`<div class="review-area">
      ${review
        ?`<div class="review-display">&ldquo;${review}&rdquo;</div>`
        :`<textarea class="review-input" id="rv-${id}" placeholder="Write a note&hellip;" rows="2">${review}</textarea>
          <button class="save-btn" onclick="saveReview('${safeKey}','${id}')">Save</button>`}
    </div>`:''}
  </div>`;
}

function renderGenres(cat){
  const byGenre=allItems(cat);
  let html='';let globalIdx=0;
  for(const [genre,items] of Object.entries(byGenre)){
    if(!items.length)continue;
    html+=`<div class="genre-group">
      <div class="genre-label">${genre} <span style="margin-left:6px;opacity:0.5">${items.length}</span></div>
      <div class="items-grid">${items.map((it,i)=>renderCard(it,globalIdx+i)).join('')}</div>
    </div>`;
    globalIdx+=items.length;
  }
  return html;
}

function genreOptions(cat){
  return Object.keys(GENRES[cat]||{}).map(g=>`<option value="${g}">${g}</option>`).join('');
}

function renderSection(cat){
  const flat=allFlat(cat);
  const done=flat.filter(i=>(state[getKey(i)]||{}).done).length;
  const catId=cat.replace(/[^a-z0-9]/gi,'_');
  return `<div class="section ${cat===activeTab?'active':''}" id="sec-${catId}">
    <div class="section-head">
      <h2>${cat}</h2>
      <div class="section-meta"><strong>${done}</strong> of ${flat.length} completed</div>
    </div>
    ${renderGenres(cat)}
    <div class="add-panel">
      <h3>Add to ${cat}</h3>
      <div class="add-fields">
        <input type="text" id="add-title-${catId}" placeholder="Title" />
        <select id="add-genre-${catId}"><option value="">Genre (optional)</option>${genreOptions(cat)}</select>
        <input type="text" id="add-note-${catId}" placeholder="Notes (optional)" />
        <button class="add-submit" onclick="addItem('${cat}')">Add &rarr;</button>
      </div>
    </div>
  </div>`;
}

function renderTabs(){
  document.getElementById('tabs').innerHTML=CATEGORIES.map(cat=>{
    const flat=allFlat(cat);
    const done=flat.filter(i=>(state[getKey(i)]||{}).done).length;
    return `<div class="tab ${cat===activeTab?'active':''}" onclick="switchTab('${cat}')">
      ${ICONS[cat]} ${cat}<span class="tab-count">${done}/${flat.length}</span>
    </div>`;
  }).join('');
}

function updateTotal(){
  let total=0,done=0;
  CATEGORIES.forEach(cat=>{const f=allFlat(cat);total+=f.length;done+=f.filter(i=>(state[getKey(i)]||{}).done).length;});
  const el=document.getElementById('total-pill');
  if(el)el.innerHTML=`<strong>${done}</strong> of ${total} completed`;
}

function render(){
  cardCounter=0;
  renderTabs();
  document.getElementById('main').innerHTML=CATEGORIES.map(renderSection).join('');
  updateTotal();
}

function switchTab(cat){activeTab=cat;render();window.scrollTo(0,0);}

function toggleDone(key){
  state[key]=state[key]||{};
  state[key].done=!state[key].done;
  saveState(state);render();
}
function setRating(key,n){
  state[key]=state[key]||{};
  state[key].rating=n;
  saveState(state);render();
}
function saveReview(key,cardId){
  const el=document.getElementById('rv-'+cardId);
  if(!el)return;
  state[key]=state[key]||{};
  state[key].review=el.value.trim();
  saveState(state);render();
}
function addItem(cat){
  const catId=cat.replace(/[^a-z0-9]/gi,'_');
  const titleEl=document.getElementById('add-title-'+catId);
  const genreEl=document.getElementById('add-genre-'+catId);
  const noteEl=document.getElementById('add-note-'+catId);
  const title=titleEl.value.trim();
  if(!title){titleEl.focus();return;}
  userItems.push({title,type:cat,note:noteEl.value.trim(),genre:genreEl.value||'',source:'user'});
  saveUserItems(userItems);render();
}
function delItem(key){
  const withoutPrefix=key.replace(/^u:/,'');
  const ci=withoutPrefix.indexOf(':');
  const type=withoutPrefix.substring(0,ci);
  const title=withoutPrefix.substring(ci+1);
  userItems=userItems.filter(i=>!(i.type===type&&i.title===title));
  saveUserItems(userItems);
  delete state[key];
  saveState(state);render();
}

render();
</script>
